services:
  mongodb:
    image: mongo:8.0
    container_name: transaction-ledger-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transaction-ledger-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/transaction_ledger
      - CORS_ORIGIN=*
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo-data:
